<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05061a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- per-page title and tags; the build (scripts/prerender.mjs) replaces this block -->
    <!--seo:start-->
    <title>Riadenie IT projektov, kybernetická bezpečnosť a GDPR | Danau</title>
    <meta
      name="description"
      content="Pomáhame organizáciám pripraviť, riadiť a doručiť zmeny v oblastiach IT, bezpečnosti, ochrany osobných údajov, dát a procesov. DANAU, s.r.o., Bratislava."
    />
    <!--seo:end-->
    <!-- The prerendered page holds the first render, whose entrances start hidden: keep its text
         visible until the app takes over (src/main.tsx removes this rule). -->
    <style id="ssr-visible">
      #root [style*='opacity'] { opacity: 1 !important; }
      #root [style*='transform'] { transform: none !important; }
      #root [style*='filter'] { filter: none !important; }
    </style>
    <!-- without JS: no first-load screen, and a night card behind the text the pixel sphere would frame -->
    <noscript><style>
      .loader { display: none; }
      .process-orb__solution { padding: 28px; border-radius: 24px; background: #05061a; }
    </style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
