    <!-- The prerendered page holds the first render, whose entrances start hidden: keep its text

      #root [style*='opacity'] { opacity: 1 !important; }
      #root [style*='transform'] { transform: none !important; }
      #root [style*='filter'] { filter: none !important; }

    <noscript><style>.loader { display: none; }</style></noscript>
